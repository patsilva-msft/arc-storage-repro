name: ARC PVC Stress Test

on:
  workflow_dispatch:

jobs:
  runner-load:
    runs-on: arc-storage-repro

    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        worker:
          - 01
          - 02
          - 03
          - 04
          - 05
          - 06
          - 07
          - 08
          - 09
          - 10
          - 11
          - 12
          - 13
          - 14
          - 15

    steps:
      - name: Exercise work volume briefly
        shell: bash
        run: |
          printf 'worker=%s time=%s\n' \
            '${{ matrix.worker }}' "$(date --iso-8601=ns)" \
            > "${GITHUB_WORKSPACE}/probe.txt"
          sync
          sleep $((2 + RANDOM % 19))
